# T33A Key Remapping Configuration
# Format: <ORIG_KEY_CODE> <REMAPPED_KEY_CODE> [dbl]
# "dbl" suffix = single press emits double-click
# You can find key codes in linux/input-event-codes.h

# KEY_HOMEPAGE (172) -> KEY_1 (2) — double click
172 2 dbl

# KEY_ENTER (28) -> KEY_0 (11)
28 11

# KEY_POWER (116) -> KEY_H (35) — wakeup: counteracts power-key screen-off
116 35 wakeup
